# ============================================================================
# CI - Validation du déploiement n8n sur Azure
# ============================================================================
#
# Objectif : Valider que le script script.sh fonctionne correctement
#
# Ce workflow teste automatiquement :
#   1. Le déploiement d'une VM Azure
#   2. L'installation de Docker et n8n via cloud-init
#   3. L'accessibilité de n8n sur le port 5678
#   4. Le nettoyage systématique des ressources (zéro coût résiduel)
#
# ⚠️ IMPORTANT : Ce n'est PAS un déploiement en production (CD)
#    Les ressources sont TOUJOURS supprimées après validation
#
# Déclencheurs :
#   - Push sur main
#   - Pull Request vers main
#   - Déclenchement manuel
#
# Prérequis (secrets GitHub) :
#   - AZURE_CLIENT_ID
#   - AZURE_CLIENT_SECRET
#   - AZURE_TENANT_ID
#   - AZURE_SUBSCRIPTION_ID
#
# Durée moyenne : 10-20 minutes
# Coût par run : ~0.05€ (VM B2s, automatiquement supprimée)
# ============================================================================

name: CI - Validation script.sh (VM + n8n)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test

    steps:
      # ========================================
      # 1. Préparation de l'environnement
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ========================================
      # 2. Authentification Azure
      # ========================================
      # Utilise un Service Principal pour se connecter à Azure
      # Vérifie que tous les secrets requis sont présents

      - name: Azure login (service principal)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Vérifier que tous les secrets sont présents
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then echo "❌ Secret $v manquant" && exit 1; fi
          done
          
          # Connexion via Service Principal
          az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "✅ Connecté: $(az account show --query name -o tsv)"

      # ========================================
      # 3. Exécution du script de déploiement
      # ========================================
      # Lance script.sh et capture la sortie dans deploy.log
      # Le script crée : Resource Group, VNet, NSG, VM, et installe n8n

      - name: Run script.sh
        run: |
          chmod +x script.sh
          set -o pipefail
          ./script.sh 2>&1 | tee deploy.log

      # ========================================
      # 4. Extraction des informations de déploiement
      # ========================================
      # Parse le log pour récupérer :
      #   - RG : Nom du Resource Group
      #   - VM : Nom de la machine virtuelle
      #   - VM_IP : IP publique de la VM
      # Ces variables sont nécessaires pour les tests et le cleanup

      - name: Extract RG/VM/IP from logs
        id: extract
        run: |
          RG=$(grep -E '^\s*Resource Group\s*:' deploy.log | tail -n1 | awk -F':' '{print $2}' | xargs)
          VM=$(grep -E '^\s*VM\s*:' deploy.log | tail -n1 | awk -F':' '{print $2}' | xargs | awk '{print $1}')
          IP=$(grep -E '^\s*IP Publique\s*:' deploy.log | tail -n1 | awk -F':' '{print $2}' | xargs)
          
          # Stocker dans les variables d'environnement GitHub
          echo "RG=$RG" >> $GITHUB_ENV
          echo "VM=$VM" >> $GITHUB_ENV
          echo "VM_IP=$IP" >> $GITHUB_ENV
          
          # Afficher les valeurs extraites
          echo "RG=$RG"; echo "VM=$VM"; echo "IP=$IP"
          
          # Vérifier qu'on a bien tout récupéré
          if [ -z "$RG" ] || [ -z "$VM" ] || [ -z "$IP" ]; then
            echo "❌ Impossible d'extraire RG/VM/IP du log" && exit 1
          fi

      # ========================================
      # 5. Vérification de la VM sur Azure
      # ========================================
      # Confirme que la VM existe bien dans Azure

      - name: Verify VM exists
        run: |
          az vm show -g "$RG" -n "$VM" >/dev/null
          echo "✅ VM trouvée: $VM (RG: $RG)"

      # ========================================
      # 6. Test de disponibilité de n8n
      # ========================================
      # Attend que n8n réponde sur le port 5678 (max 8 minutes)
      # Codes HTTP acceptés :
      #   - 200 : OK
      #   - 401 : Unauthorized (auth requise = service OK)
      #   - 302/308 : Redirect (service OK)
      #
      # En cas d'échec : affiche les diagnostics (cloud-init, docker, logs n8n)

      - name: Wait for n8n to be ready
        run: |
          echo "⏳ Attente n8n (port 5678) - max 8 min"
          READY=0
          
          # 16 tentatives × 30 secondes = 8 minutes
          for i in {1..16}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 http://$VM_IP:5678 || echo "000")
            echo "[$i] HTTP=$CODE"
            
            # Si n8n répond avec un code valide, succès
            if [[ "$CODE" =~ ^(200|401|302|308)$ ]]; then
              echo "✅ n8n répond (HTTP $CODE)"
              READY=1
              break
            fi
            
            sleep 30
          done
          
          # Si échec après 8 min, afficher les diagnostics et échouer
          if [ "$READY" -ne 1 ]; then
            echo "❌ n8n ne répond pas après 8 min"
            echo "📋 Diagnostics:"
            az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
              --scripts "cloud-init status; echo '---'; docker ps -a; echo '---'; docker logs --tail 100 n8n 2>&1 || true" \
              --query 'value[0].message' -o tsv 2>/dev/null || true
            exit 1
          fi

      # ========================================
      # 7. Génération du résumé
      # ========================================
      # Crée un résumé visible dans l'interface GitHub Actions
      # Affiche le statut (succès/échec) et les infos de la VM

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Validation réussie" >> $GITHUB_STEP_SUMMARY
            echo "- VM: $VM" >> $GITHUB_STEP_SUMMARY
            echo "- RG: $RG" >> $GITHUB_STEP_SUMMARY
            echo "- IP: $VM_IP" >> $GITHUB_STEP_SUMMARY
            echo "- n8n accessible sur http://$VM_IP:5678" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Échec de validation" >> $GITHUB_STEP_SUMMARY
            echo "- VM: ${VM:-N/A}" >> $GITHUB_STEP_SUMMARY
            echo "- RG: ${RG:-N/A}" >> $GITHUB_STEP_SUMMARY
            echo "- IP: ${VM_IP:-N/A}" >> $GITHUB_STEP_SUMMARY
            echo "Voir les logs ci-dessus pour les détails." >> $GITHUB_STEP_SUMMARY
          fi

      # ========================================
      # 8. Nettoyage des ressources Azure
      # ========================================
      # TOUJOURS exécuté (succès ou échec)
      # Supprime tous les Resource Groups créés pendant le test
      # Suppression asynchrone (--no-wait) pour ne pas bloquer le workflow
      #
      # ⚠️ CRITIQUE : Évite les coûts Azure inutiles
      #    Aucune ressource ne reste après la CI

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Nettoyage des ressources Azure..."
          
          # Liste des RG potentiels à supprimer
          RG_LIST=()
          [ -n "${RG:-}" ] && RG_LIST+=("$RG")
          RG_LIST+=("projet-docker-rg" "projet-docker-rg-swe")
          
          # Suppression async (dédupliquée avec sort -u)
          for rg in $(printf '%s\n' "${RG_LIST[@]}" | sort -u); do
            if az group show -n "$rg" >/dev/null 2>&1; then
              echo "  → Suppression de $rg"
              az group delete -n "$rg" --yes --no-wait || true
            fi
          done
          
          echo "✅ Cleanup lancé en arrière-plan"
