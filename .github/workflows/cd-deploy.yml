name: CI - Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validation du script

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérification syntaxe bash
        run: |
          echo "🔍 Vérification de script.sh..."
          bash -n script.sh
          echo "✅ Script valide"

      - name: Vérification shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          echo "🔍 Analyse statique du script..."
          shellcheck script.sh || echo "⚠️ Warnings détectés mais non bloquants"

      - name: Résumé
        run: |
          echo "## ✅ Validation réussie" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Le script est prêt à être utilisé localement." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pour déployer :" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "chmod +x script.sh" >> $GITHUB_STEP_SUMMARY
          echo "./script.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
